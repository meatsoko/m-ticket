project_id = "meatsoko-ticketing"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[functions]
[functions.stk-push]
verify_jwt = false
[functions.daraja-callback]
verify_jwt = false
[functions.order-status]
verify_jwt = false
[functions.paystack-verify]
verify_jwt = false
[functions.paystack-webhook]
verify_jwt = false
[functions.lookup]
verify_jwt = false
[functions.ticket-by-token]
verify_jwt = false
[functions.redeem]
verify_jwt = true
[functions.sync-tokens]
verify_jwt = true
[functions.reserve]
verify_jwt = false
[functions.reservation-status]
verify_jwt = false
[functions.reservation-by-token]
verify_jwt = false
[functions.reservation-lookup]
verify_jwt = false

# Merchandise. merch-checkout and merch-order are guest-facing (no sign-in); each
# key it accepts is a 128-bit secret. merch-fx-refresh checks for the service-role
# key itself — gateway JWT verification is off so a non-JWT secret key also works.
[functions.merch-checkout]
verify_jwt = false

[functions.merch-order]
verify_jwt = false

[functions.merch-fx-refresh]
verify_jwt = false

# Called by Supabase Cron (pg_net) with no key; it can only confirm payments
# Paystack says succeeded, and rate-limits itself. See the function's header.
[functions.paystack-reconcile]
verify_jwt = false

# Public: the pass token in the body is the authorisation (see the function header).
[functions.upgrade-reservation]
verify_jwt = false

# Public vendor registration (see the function header); rate-limited per phone and IP.
[functions.vendor-apply]
verify_jwt = false
