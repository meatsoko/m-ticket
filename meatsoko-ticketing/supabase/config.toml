project_id = "meatsoko-ticketing"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[functions]
[functions.stk-push]
verify_jwt = false
[functions.daraja-callback]
verify_jwt = false
[functions.order-status]
verify_jwt = false
[functions.paystack-verify]
verify_jwt = false
[functions.paystack-webhook]
verify_jwt = false
[functions.lookup]
verify_jwt = false
[functions.ticket-by-token]
verify_jwt = false
[functions.redeem]
verify_jwt = true
[functions.sync-tokens]
verify_jwt = true
[functions.reserve]
verify_jwt = false
[functions.reservation-status]
verify_jwt = false
[functions.reservation-by-token]
verify_jwt = false
[functions.reservation-lookup]
verify_jwt = false

# Merchandise. merch-checkout and merch-order are guest-facing (no sign-in); each
# key it accepts is a 128-bit secret. merch-fx-refresh checks for the service-role
# key itself — gateway JWT verification is off so a non-JWT secret key also works.
[functions.merch-checkout]
verify_jwt = false

[functions.merch-order]
verify_jwt = false

[functions.merch-fx-refresh]
verify_jwt = false

# Called by Supabase Cron (pg_net) with no key; it can only confirm payments
# Paystack says succeeded, and rate-limits itself. See the function's header.
[functions.paystack-reconcile]
verify_jwt = false

# Public: the pass token in the body is the authorisation (see the function header).
[functions.upgrade-reservation]
verify_jwt = false

# Public vendor registration (see the function header); rate-limited per phone and IP.
[functions.vendor-apply]
verify_jwt = false

# Online attendance: public registration and the private watch page's access
# check (the access code in the body is the authorisation). Rate-limited.
[functions.online-register]
verify_jwt = false

[functions.online-access]
verify_jwt = false

# Platter add-ons: the pass token in the body is the authorisation. Rate-limited.
[functions.platter-addon]
verify_jwt = false

# Investors' visit: public registration form (no account; rate-limited per IP
# and per email). Writes with the service role; never overwrites an existing
# registration.
[functions.investor-register]
verify_jwt = false

# Occasion booking (celebrations): public request form and the guest's private
# link (by its 32-hex access token). Rate-limited per IP and per phone; writes
# use the service role. No prices or payments.
[functions.celebration-request]
verify_jwt = false

# Event Orders: public receipt, read by its unguessable receipt token (in the
# body). Rate-limited per IP; the phone is masked and staff are not named.
[functions.event-order-receipt]
verify_jwt = false

# Event Orders for customers: ordering from a pass. The pass access_token (or an
# order's receipt token) in the body is the authorisation. Rate-limited.
[functions.customer-order]
verify_jwt = false

# PayHero M-Pesa (alongside Paystack): public start / status / callback /
# reconcile. None of them trusts its caller: only PayHero's transaction-status
# API confirms money (see _shared/payhero.ts). Rate-limited.
[functions.payhero-pay]
verify_jwt = false

[functions.payhero-status]
verify_jwt = false

[functions.payhero-callback]
verify_jwt = false

[functions.payhero-reconcile]
verify_jwt = false

# Daraja M-Pesa Express result (MPESA_PROVIDER=daraja). Unsigned callback: it
# only triggers a Safaricom STK Push Query (see _shared/payhero.ts verifyMpesa).
[functions.stk-result]
verify_jwt = false
